[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-arb-scanner"
version = "0.1.0"
description = "Read-only Polymarket structural arbitrage scanner and simulation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "websockets>=12.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "SQLAlchemy>=2.0.25",
  "pandas>=2.2.0",
  "plotly>=5.18.0",
  "streamlit>=1.31.0",
  "tenacity>=8.2.0",
  "APScheduler>=3.10.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
  "aiosqlite>=0.19.0",
  "Jinja2>=3.1.0",
  "filelock>=3.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "mypy>=1.8.0", "ruff>=0.2.0"]

[project.scripts]
polymarket-scanner = "polymarket_scanner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
strict_optional = true
